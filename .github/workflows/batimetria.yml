name: Batimetría y relieve tierra-mar

# El fondo marino apenas cambia: se lanza a mano (Actions -> Batimetría -> Run workflow),
# p. ej. cuando EMODnet publique una versión nueva del DTM.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  batimetria:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install numpy rasterio requests mercantile contourpy pillow pmtiles

      - name: EMODnet + Terrain Tiles -> relieve, batimetría e isóbatas
        run: python -u scripts/construir_batimetria.py

      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898888+github-actions[bot]@users.noreply.github.com"
          git add data/relieve.pmtiles data/batimetria.pmtiles data/capas/isobatas.geojson data/resumen_batimetria.json
          git diff --cached --quiet && exit 0
          git commit -m "Batimetría: EMODnet $(date -u +%F)"
          git pull --rebase -q && git push
