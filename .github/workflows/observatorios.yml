name: Sincronizar observatorios

on:
  schedule:
    - cron: "47 5 * * *"      # cada día, 07:47 en Madrid (tras el mapa de VUT)
    - cron: "17 13 * * *"     # segunda pasada, 15:17: cubre si GitHub se salta la primera
  workflow_dispatch:

permissions:
  contents: write

concurrency: sincronizar

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Indicadores y capas de los observatorios
        run: python -u scripts/sincronizar_observatorios.py
      - name: Publicar si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898888+github-actions[bot]@users.noreply.github.com"
          git add data/observatorios.json data/capas
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Observatorios: sincronización $(date -u +%F)"
          git pull --rebase -q && git push
